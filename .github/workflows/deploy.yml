name: Deploy Kiwoom Bot to Azure Storage & AKS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build, Upload to Storage, ACR Push & Deploy to AKS
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 3. Install Frontend Dependencies & Build Bundle
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: 4. Azure Login via OIDC (Federated Credentials)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 5. Clean Old Files & Upload to Azure Storage Container
        run: |
          echo "🧹 [Azure Storage] 구버전 배포 파일 삭제 중: ${{ secrets.AZURE_STORAGE_CONTAINER }}/deploy/kiwoom_rest_project..."
          az storage blob delete-batch \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --source ${{ secrets.AZURE_STORAGE_CONTAINER }} \
            --pattern "deploy/kiwoom_rest_project/*" \
            --auth-mode login || true

          echo "🚀 [Azure Storage] 최신 프로젝트 소스 및 빌드 파일 업로드 중..."
          az storage blob upload-batch \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --destination "${{ secrets.AZURE_STORAGE_CONTAINER }}/deploy/kiwoom_rest_project" \
            --source . \
            --pattern "*" \
            --auth-mode login \
            --overwrite true

      - name: 6. Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ secrets.AZURE_ACR_NAME }}

      - name: 7. Build and Push Docker Image (kiwoom-bot) to ACR
        run: |
          ACR_REGISTRY="${{ secrets.AZURE_ACR_NAME }}.azurecr.io"
          IMAGE_NAME="kiwoom-bot"
          COMMIT_TAG="${{ github.sha }}"

          echo "🐳 [Docker Build] 이미지 빌드: $ACR_REGISTRY/$IMAGE_NAME:latest ($COMMIT_TAG)..."
          docker build \
            -t $ACR_REGISTRY/$IMAGE_NAME:latest \
            -t $ACR_REGISTRY/$IMAGE_NAME:$COMMIT_TAG \
            .

          echo "📤 [Docker Push] ACR로 이미지 푸시..."
          docker push $ACR_REGISTRY/$IMAGE_NAME:latest
          docker push $ACR_REGISTRY/$IMAGE_NAME:$COMMIT_TAG

      - name: 8. Set up Kubectl and Connect to AKS Cluster
        uses: azure/aks-set-context@v4
        with:
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}

      - name: 9. Rollout Restart AKS Deployment (kiwoom-bot)
        run: |
          echo "🚀 [AKS Rollout] deployment/kiwoom-bot 무중단 롤아웃 재시작 실행..."
          if kubectl get deployment kiwoom-bot -n mzc-apps >/dev/null 2>&1; then
            kubectl rollout restart deployment/kiwoom-bot -n mzc-apps
            kubectl rollout status deployment/kiwoom-bot -n mzc-apps --timeout=180s
          else
            kubectl rollout restart deployment/kiwoom-bot
            kubectl rollout status deployment/kiwoom-bot --timeout=180s
          fi
          echo "🎉 [AKS Deployment] kiwoom-bot 서비스 배포가 성공적으로 완료되었습니다."
